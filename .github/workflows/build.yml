name: Build CDEK Windows EXE

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Скачиваем код репозитория
        uses: actions/checkout@v4

      - name: Устанавливаем Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Устанавливаем зависимости и PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Скачиваем портативный SumatraPDF.exe
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://www.sumatrapdfreader.org/dl/rel/3.5.2/SumatraPDF-3.5.2-64.zip" -OutFile "sumatra.zip"
          Expand-Archive -Path "sumatra.zip" -DestinationPath "sumatra_tmp" -Force
          $exe = Get-ChildItem -Path "sumatra_tmp" -Filter "*.exe" | Select-Object -First 1
          Copy-Item $exe.FullName -Destination "SumatraPDF.exe"

      - name: Собираем EXE через PyInstaller
        run: |
          pyinstaller --noconfirm --onefile --windowed --name "CDEK_Electroconnect" --collect-all flet --collect-all playwright main.py

      - name: Упаковываем релиз с SumatraPDF.exe
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "release_pkg"
          Copy-Item "dist/CDEK_Electroconnect.exe" -Destination "release_pkg/"
          Copy-Item "SumatraPDF.exe" -Destination "release_pkg/"
          Compress-Archive -Path "release_pkg/*" -DestinationPath "CDEK_Electroconnect_Win64.zip" -Force

      - name: Загружаем готовый архив (Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: CDEK_Electroconnect_Win64
          path: CDEK_Electroconnect_Win64.zip
